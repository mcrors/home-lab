---
# Cards that cannot be discovered: off-cluster targets, and the Calendar. Anything
# with a Kubernetes Ingress or a Traefik IngressRoute is discovered from its
# `gethomepage.dev/*` annotations instead, so listing it here would produce a
# duplicate card that no longer updates when the service moves.
#
# Every off-cluster host and port below was checked against the live machine on
# 2026-09-12, not taken from the project plan. The plan also listed Garage S3 and a
# Postgres node; neither is running anywhere on the network, so neither is here.

# Must be nested under Media here, not just in the settings.yaml layout: a group
# declared at this file's top level resolves without a parent and renders as its own
# section below every other one. An array value is a group, a map value is a service.
#
# No credentials of its own; each integration names an existing card and reuses its
# url and key. service_group is the leaf group, Arr, not the parent Media. A
# mismatch with the sonarr/radarr annotations is silent and shows as an empty card.
- Media:
    - Calendar:
        - Calendar:
            icon: mdi-calendar
            description: Upcoming releases
            widget:
              type: calendar
              view: monthly
              integrations:
                - type: sonarr
                  service_group: Arr
                  service_name: Sonarr
                - type: radarr
                  service_group: Arr
                  service_name: Radarr

- Off-Cluster:
    - NAS:
        # OpenMediaVault on lib-hp-01 (192.168.1.96). http, not https: that host
        # serves plain nginx on port 80 and refuses connections on 443.
        href: http://omv.houli.eu/
        description: OpenMediaVault · lib-hp-01
        icon: openmediavault
        siteMonitor: http://omv.houli.eu/

    - Prometheus:
        # Runs in Docker on lib-pi-06 (192.168.1.226) behind an nginx reverse
        # proxy that terminates TLS and serves this one server_name.
        href: https://prometheus.houli.eu/
        description: Metrics and alerting · lib-pi-06
        icon: prometheus
        siteMonitor: https://prometheus.houli.eu/
