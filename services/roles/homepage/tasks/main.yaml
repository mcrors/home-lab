---

- name: Ensure homepage namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ homepage_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible

- name: Apply homepage widget API key Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ homepage_widget_secret_name }}"
        namespace: "{{ homepage_namespace }}"
      type: Opaque
      # stringData, not data, so no b64encode filter is needed and the key is
      # never base64ed into a task argument by hand. The API server encodes it.
      #
      # Each key here is projected into the pod as HOMEPAGE_VAR_<NAME> by
      # extraEnv in files/values.yaml. The name after that prefix has to match
      # the placeholder text in the owning service's widget.key annotation
      # exactly: substitution matches on the HOMEPAGE_VAR_ prefix and treats the
      # remainder as a literal, so a mismatch leaves the raw {{...}} text in the
      # widget config and the service answers 401.
      stringData:
        SONARR_KEY: "{{ vault_sonarr_api_key }}"
  # The Secret body is the API key. Without this, a -v run prints it.
  no_log: true

- name: Install/Upgrade homepage with values.yaml
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: homepage
    chart_ref: "{{ playbook_dir }}/helm/homepage"
    release_namespace: "{{ homepage_namespace }}"
    create_namespace: false
    wait: true
    values_files:
      - "{{ role_path }}/files/values.yaml"
    # extraEnv lives here rather than in files/values.yaml because it has to
    # reference homepage_widget_secret_name, and a values_files entry is handed
    # to helm as a path without ever being Jinja-rendered. Same reason the plex
    # role passes its secretName through values: instead of its values file.
    #
    # The chart renders this verbatim into the container's env (deployment.yaml),
    # so this is a plain EnvVar list. secretKeyRef, not a literal value: the key
    # must not appear in the helm release, which is stored as a Secret in the
    # cluster but is readable by anything that can read Secrets in this namespace
    # and is kept for every revision in the release history.
    values:
      extraEnv:
        - name: HOMEPAGE_VAR_SONARR_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ homepage_widget_secret_name }}"
              key: SONARR_KEY
    # Each homepage config file stays a real file on disk and reaches the chart
    # through helm --set-file, which kubernetes.core.helm spells as a set_values
    # entry with value_type: file. Only the path travels on the command line, so
    # size is not a constraint, and custom.css stays a .css file that an editor
    # can lint rather than a quoted blob inside values.yaml.
    #
    # The backslash before each dot is load-bearing. Keys here are filenames, and
    # helm reads an unescaped dot as a nesting separator: config.custom.css=...
    # builds a three-level structure and never sets the custom.css key. The
    # chart ships a valid default for every key, so that failure is silent — the
    # pod starts and serves the default content. Verify against the deployed
    # ConfigMap, not against this task's exit code:
    #
    #   kubectl get configmap homepage -n homepage -o jsonpath='{.data}'
    #
    # Written out one line per file rather than generated from a loop: seven
    # static entries are easier to read and to grep than the Jinja that would
    # produce them, and this repo has already been bitten by whitespace inside a
    # Jinja loop in the prometheus template.
    set_values:
      - value: 'config.settings\.yaml={{ role_path }}/files/settings.yaml'
        value_type: file
      - value: 'config.services\.yaml={{ role_path }}/files/services.yaml'
        value_type: file
      - value: 'config.widgets\.yaml={{ role_path }}/files/widgets.yaml'
        value_type: file
      - value: 'config.bookmarks\.yaml={{ role_path }}/files/bookmarks.yaml'
        value_type: file
      - value: 'config.kubernetes\.yaml={{ role_path }}/files/kubernetes.yaml'
        value_type: file
      - value: 'config.custom\.css={{ role_path }}/files/custom.css'
        value_type: file
      - value: 'config.custom\.js={{ role_path }}/files/custom.js'
        value_type: file
