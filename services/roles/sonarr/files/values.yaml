resources:
  limits:
    memory: 1Gi

ingress:
  annotations:
    prometheus.io/probe: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Sonarr"
    gethomepage.dev/group: "Arr"
    gethomepage.dev/icon: "sonarr"
    gethomepage.dev/description: "TV series management"
    # widget.key is literal placeholder text. Homepage substitutes
    # {{HOMEPAGE_VAR_*}} into annotation values, so the key stays in the pod
    # environment and never reaches this Ingress. The name after the prefix must
    # match the Secret key exactly, or the service answers 401.
    gethomepage.dev/widget.type: "sonarr"
    gethomepage.dev/widget.url: "http://sonarr.sonarr.svc.cluster.local:8989"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
  hosts:
    - host: sonarr.houli.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ""
      hosts:
        - sonarr.houli.eu

nodeSelector:
  longhorn-storage: "true"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_size
              operator: In
              values: ["medium", "large"]

env:
  TZ: "Europe/Prague"
