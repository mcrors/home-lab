strategy:
  type: Recreate

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  className: traefik
  annotations:
    prometheus.io/probe: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Uptime Kuma"
    gethomepage.dev/group: "CI/Ops"
    gethomepage.dev/icon: "uptime-kuma"
    gethomepage.dev/description: "Service uptime monitoring"
  hosts:
    - host: uptime.houli.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - uptime.houli.eu

volume:
  enabled: true
  size: 2Gi
  storageClassName: longhorn

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_size
              operator: In
              values: ["medium", "large"]

