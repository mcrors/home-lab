configVolume:
  nfs:
    path: /transmission

extraPodLabels:
  workload-class: heavy

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 30
        preference:
          matchExpressions:
            - key: node_type
              operator: In
              values: ["nuc"]
      - weight: 100
        preference:
          matchExpressions:
            - key: node_type
              operator: NotIn
              values: ["potato"]
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: workload-class
                operator: In
                values: ["heavy"]
          topologyKey: kubernetes.io/hostname

ingress:
  annotations:
    prometheus.io/probe: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Transmission"
    gethomepage.dev/group: "Streaming"
    gethomepage.dev/icon: "transmission"
    gethomepage.dev/description: "BitTorrent client"
    # No key because this RPC has authentication disabled, tracked as a problem in
    # .scratch/cluster-access-control/. A 409 from /transmission/rpc is the CSRF
    # handshake, not an auth failure.
    gethomepage.dev/widget.type: "transmission"
    gethomepage.dev/widget.url: "http://transmission.transmission.svc.cluster.local:9091"
  hosts:
    - host: transmission.houli.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - transmission.houli.eu
