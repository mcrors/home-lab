ingress:
  annotations:
    prometheus.io/probe: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Radarr"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "radarr"
    gethomepage.dev/description: "Movie library management"
    # Live-data widget. widget.key is the literal placeholder text, not the key;
    # homepage substitutes it from the pod environment, so no secret lands in
    # this Ingress. The reasoning and the URL choice are written out once in
    # services/roles/sonarr/files/values.yaml rather than repeated here.
    gethomepage.dev/widget.type: "radarr"
    gethomepage.dev/widget.url: "http://radarr.radarr.svc.cluster.local:7878"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
  hosts:
    - host: radarr.houli.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ""
      hosts:
        - radarr.houli.eu

nodeSelector:
  longhorn-storage: "true"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_size
              operator: In
              values: ["medium", "large"]

env:
  TZ: "Europe/Prague"
