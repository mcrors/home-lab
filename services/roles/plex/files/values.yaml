ingress:
  annotations:
    # Probed by the blackbox-ingress job. Plex returns 401 at /, so the probe
    # needs the web app path to get a 200.
    prometheus.io/probe: "true"
    prometheus.io/probe-path: "/web/index.html"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Plex"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "plex"
    gethomepage.dev/description: "Media streaming server"
    # Live-data widget. widget.key is the literal placeholder text, not the key;
    # homepage substitutes it from the pod environment, so no secret lands in
    # this Ingress. The reasoning and the URL choice are written out once in
    # services/roles/sonarr/files/values.yaml rather than repeated here.
    #
    # The credential is Plex's PlexOnlineToken, which authenticates the Plex
    # account rather than just this server, so it is a broader secret than the
    # *arr API keys. It is held as HOMEPAGE_VAR_PLEX_KEY in the homepage-widgets
    # Secret, from vault_plex_api_key. Unrelated to vault_plex_claim_token, which
    # this role already uses for first-time server claiming.
    #
    # Shows current streams, then album, movie and TV counts. Streams is the
    # number worth having; the three library counts barely move.
    gethomepage.dev/widget.type: "plex"
    gethomepage.dev/widget.url: "http://plex.plex.svc.cluster.local:32400"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PLEX_KEY}}"
  hosts:
    - host: plex.houli.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ""
      hosts:
        - plex.houli.eu
  tcpPassthrough:
    enabled: true
nodeSelector:
  node_size: x-large
podLabels:
  workload-class: heavy
env:
  advertiseIp: "http://plex.houli.eu:32400,http://192.168.1.250:32400"
