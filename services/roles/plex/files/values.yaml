ingress:
  annotations:
    # Probed by the blackbox-ingress job. Plex returns 401 at /, so the probe
    # needs the web app path to get a 200.
    prometheus.io/probe: "true"
    prometheus.io/probe-path: "/web/index.html"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Plex"
    gethomepage.dev/group: "Streaming"
    gethomepage.dev/icon: "plex"
    gethomepage.dev/description: "Media streaming server"
    # PlexOnlineToken authenticates the Plex account, not just this server, so it
    # is a broader secret than the *arr keys. Unrelated to vault_plex_claim_token,
    # which this role already uses for server claiming.
    gethomepage.dev/widget.type: "plex"
    gethomepage.dev/widget.url: "http://plex.plex.svc.cluster.local:32400"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PLEX_KEY}}"
  hosts:
    - host: plex.houli.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ""
      hosts:
        - plex.houli.eu
  tcpPassthrough:
    enabled: true

# A memory request with no limit moves Plex out of the BestEffort QoS class
# and into Burstable, so the kubelet stops treating it as the first candidate
# for eviction under node memory pressure. No limit is set on purpose: almost
# all of the 20 GiB the metrics show is reclaimable page cache from reading
# media, and a limit sized against that figure would force pointless reclaim.
# Plex's own footprint (container_memory_rss) sits around 300 MiB.
resources:
  requests:
    memory: 1Gi

nodeSelector:
  node_size: x-large
podLabels:
  workload-class: heavy
env:
  advertiseIp: "http://plex.houli.eu:32400,http://192.168.1.250:32400"
