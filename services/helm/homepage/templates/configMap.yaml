apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homepage.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
data:
  # One key per file homepage expects in /app/config. The deployment mounts
  # this same map by ranging over .Values.config, so a key added here is
  # mounted automatically and the two can never drift apart.
  {{- range $filename, $content := .Values.config }}
  {{ $filename }}: |
    {{- $content | nindent 4 }}
  {{- end }}
