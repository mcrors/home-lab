---

- name: Add jenkins Helm repo
  kubernetes.core.helm_repository:
    name: jenkinsci
    repo_url: https://charts.jenkins.io

- name: Update Helm repo cache
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: cache-refresh
    namespace: kube-system
    state: absent
    update_repo_cache: true

- name: Ensure jenkins namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ jenkins_namespace }}"

- name: Apply jenkins-credentials Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: jenkins-credentials
        namespace: "{{ jenkins_namespace }}"
      stringData:
        admin-user: "{{ jenkins_admin_user }}"
        admin-password: "{{ vault_jenkins_admin_password }}"
        github-pat: "{{ vault_jenkins_github_token }}"
        dockerhub-token: "{{ vault_jenkins_docker_token }}"
  no_log: true

- name: Install/Upgrade jenkins with values.yaml
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: jenkins
    chart_ref: jenkinsci/jenkins
    chart_version: "{{ jenkins_chart_version }}"
    release_namespace: "{{ jenkins_namespace }}"
    create_namespace: false
    wait: true
    # First start pulls 275 MiB across 12 layers onto a pi, provisions a Longhorn
    # volume, then downloads nine plugins and their dependencies. The module
    # default is helm's 5m0s, and a first install that times out strands the
    # release in pending-install, which needs a manual uninstall before a retry.
    timeout: "15m0s"
    values_files:
      - "{{ role_path }}/files/values.yaml"
