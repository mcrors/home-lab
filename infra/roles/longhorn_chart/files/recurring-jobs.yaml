# Cron fields are evaluated in UTC. The longhorn-manager pod has no timezone set.
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-trim
  namespace: longhorn-system
spec:
  name: weekly-trim
  task: filesystem-trim
  cron: "0 22 * * 6"
  retain: 0
  concurrency: 1
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  name: daily-snapshot
  task: snapshot
  cron: "0 23 * * *"
  retain: 7
  concurrency: 1
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  name: daily-backup
  task: backup
  cron: "0 1 * * *"
  retain: 18
  concurrency: 1
  parameters:
    full-backup-interval: "6"
  groups:
    - default
