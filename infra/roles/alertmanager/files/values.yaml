resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node_size
              operator: In
              values:
                - small
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_size
              operator: NotIn
              values:
                - x-large

persistence:
  enabled: false

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    prometheus.io/probe: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Alertmanager"
    gethomepage.dev/group: "Infra"
    gethomepage.dev/icon: "alertmanager"
    gethomepage.dev/description: "Alert routing and notification"
  hosts:
    - host: alertmanager.houli.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - alertmanager.houli.eu

config:
  enabled: true
  global:
    resolve_timeout: 5m
  route:
    receiver: 'ntfy'
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - matchers:
          - severity="critical"
        receiver: 'ntfy'
        repeat_interval: 1h
  receivers:
    - name: 'ntfy'
      webhook_configs:
        - url: 'http://ntfy-bridge.ntfy.svc.cluster.local:8000/hook'
          send_resolved: true
  inhibit_rules:
    - source_matchers:
        - severity="critical"
      target_matchers:
        - severity="warning"
      equal:
        - alertname
        - instance
    # A synchronised reboot would otherwise send one NodeRebooted notification per node on
    # top of the aggregate. MultiNodeRebootWindow carries no `instance` label, so the rule
    # above cannot suppress them; both alerts do carry `cluster`.
    - source_matchers:
        - alertname="MultiNodeRebootWindow"
      target_matchers:
        - alertname="NodeRebooted"
      equal:
        - cluster
