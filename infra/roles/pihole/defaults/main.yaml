pihole_namespace: pihole
chart_version: 2.35.0
pihole_pvc_size: 4Gi

# Two independent releases rather than one Deployment with several replicas.
# Pi-hole keeps its query log, gravity database and web sessions in SQLite, which
# several pods cannot share. See docs/adr/0003-pihole-as-two-helm-releases.md.
#
# avoid_release names the other release. The chart turns that into a required
# anti-affinity rule on the `release` label, keeping the two pods on separate
# nodes. Everything else the releases need is identical and lives in files/.
pihole_instances:
  - name: pihole-1
    display_name: Pi-hole 1
    dns_ip: "{{ k3s_pihole_1_dns_ip }}"
    host: pihole-1.houli.eu
    avoid_release: pihole-2
  - name: pihole-2
    display_name: Pi-hole 2
    dns_ip: "{{ k3s_pihole_2_dns_ip }}"
    host: pihole-2.houli.eu
    avoid_release: pihole-1

# Gravity is rebuilt on every run. Pi-hole only downloads the lists once, on
# first boot, so without this an adlist.yaml edit changes nothing that blocks.
# Set false with -e when changing something unrelated and the several minutes
# per instance are not worth spending.
pihole_update_gravity: true

# What the per-instance verification asserts before the play moves on. The first
# proves the custom DNS entries loaded, the second proves gravity is live.
pihole_verify_name: grafana.houli.eu
pihole_verify_expect: "{{ traefik_lb_ip }}"
pihole_verify_blocked: doubleclick.net

# Set true to have the reconcile print the differences without applying them.
pihole_reconcile_check_mode: false
