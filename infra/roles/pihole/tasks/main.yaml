---

- name: Create PiHole namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ pihole_namespace }}"

- name: Create PiHole admin secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pihole-admin-secret
        namespace: "{{ pihole_namespace }}"
      stringData:
        password: "{{ vault_pihole_admin_password }}"

# The claims are created here rather than by the chart so `helm uninstall` cannot
# take them with it. A chart-managed claim is deleted on uninstall, and because
# the longhorn class retains, its volume is left Released with a claimRef naming
# the deleted claim. A reinstall does not rebind that volume, it provisions an
# empty one. Owning the claim here means a release can be removed and reinstalled
# onto the same data. Same pattern as the grafana, ntfy and signal_bridge roles.
- name: Ensure pihole data claims exist
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ item.name }}-data"
        namespace: "{{ pihole_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: "{{ pihole_pvc_size }}"
  loop: "{{ pihole_instances }}"
  loop_control:
    label: "{{ item.name }}-data"

- name: Add pihole Helm repo
  kubernetes.core.helm_repository:
    name: mojo2600
    repo_url: https://mojo2600.github.io/pihole-kubernetes/

- name: Update Helm repo cache
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: cache-refresh
    namespace: kube-system
    state: absent
    update_repo_cache: true

# Both releases read the same three values files, so blocklists, custom DNS
# records and host entries are defined once. `values` is merged over them by
# Helm and carries only what distinguishes one release from the other.
- name: Install/Upgrade pihole releases
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: "{{ item.name }}"
    chart_ref: mojo2600/pihole
    chart_version: "{{ chart_version }}"
    release_namespace: "{{ pihole_namespace }}"
    create_namespace: false
    wait: true
    values_files:
      - "{{ role_path }}/files/values.yaml"
      - "{{ role_path }}/files/dnsmasq.yaml"
      - "{{ role_path }}/files/adlist.yaml"
    values:
      # The address is requested through the annotation alone. MetalLB refuses a
      # service carrying both the annotation and spec.loadBalancerIP, and the
      # chart sets that field whenever serviceDns.loadBalancerIP is given, so
      # setting both leaves the service pending with AllocationFailed.
      # spec.loadBalancerIP is deprecated in Kubernetes, so the annotation is the
      # one to keep. Traefik requests .250 the same way.
      serviceDns:
        annotations:
          metallb.universe.tf/loadBalancerIPs: "{{ item.dns_ip }}"
      antiaff:
        enabled: true
        strict: true
        avoidRelease: "{{ item.avoid_release }}"
      persistentVolumeClaim:
        existingClaim: "{{ item.name }}-data"
      virtualHost: "{{ item.host }}"
      ingress:
        hosts:
          - "{{ item.host }}"
        tls:
          - secretName: houli-eu-wildcard
            hosts:
              - "{{ item.host }}"
  loop: "{{ pihole_instances }}"
  loop_control:
    label: "{{ item.name }}"
