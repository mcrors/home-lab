replicaCount: 1

strategyType: Recreate

image:
  repository: "pihole/pihole"
  pullPolicy: IfNotPresent

serviceDns:
  mixedService: true
  type: LoadBalancer
  port: 53
  # Cluster would rewrite every query's source address to the receiving node, so
  # Pi-hole would attribute all traffic to a handful of node addresses and the
  # per-client views would be empty. Local costs nothing here: each release has
  # one pod and its own address, and MetalLB announces an address only from a
  # node holding a ready endpoint for it.
  externalTrafficPolicy: Local

serviceDhcp:
  enabled: false

serviceWeb:
  http:
    enabled: true
    port: 80
  https:
    enabled: false  # Traefik handles TLS termination, no need for HTTPS on the pod itself
  type: ClusterIP

# virtualHost, ingress.hosts and ingress.tls name a single release and are set
# per instance in tasks/main.yaml. Each release serves its own hostname so the
# dashboard you are looking at is the instance whose query log you are reading.
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    prometheus.io/probe: "true"
    prometheus.io/probe-path: /admin/login
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: DNS
    gethomepage.dev/icon: pi-hole
  path: /
  pathType: Prefix

probes:
  liveness:
    type: command
    command:
      - /bin/sh
      - -c
      - "curl --silent http://localhost/api/info/login | jq 'if (.dns | not) then halt_error(1) end'"
    enabled: true
    initialDelaySeconds: 60
    failureThreshold: 10
    timeoutSeconds: 5
  readiness:
    type: command
    command:
      - /bin/sh
      - -c
      - "curl --silent http://localhost/api/info/login | jq 'if (.dns | not) then halt_error(1) end'"
    enabled: true
    initialDelaySeconds: 60
    failureThreshold: 10
    timeoutSeconds: 5

# FTL holds about 190Mi it cannot release: 160Mi of anonymous memory in the
# process and 32Mi of shared memory under /dev/shm for its query history. That
# floor grew from 11Mi to 150Mi over the five days after the DNS cutover, then
# flattened. Gravity rebuilds and database maintenance add steps of 40Mi to
# 70Mi that last several minutes. At a 256Mi limit those steps no longer fit,
# and both instances were OOMKilled repeatedly on 2026-10-03 and 2026-10-04.
#
# The request is set to the floor rather than to the idle footprint. At the
# previous 128Mi request each pod permanently exceeded its own request, which
# made it an eviction candidate whenever its node came under memory pressure.
resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 256Mi

# enabled makes the chart mount a claim rather than an emptyDir. existingClaim is
# set per instance in tasks/main.yaml, which also creates the claim, so the
# chart's own size, storageClass and accessModes keys would be ignored and are
# deliberately absent. The claim spec lives in the role.
persistentVolumeClaim:
  enabled: true

nodeSelector:
  node_type: pi

adminPassword: ""
admin:
  enabled: true
  existingSecret: "pihole-admin-secret"
  passwordKey: "password"

