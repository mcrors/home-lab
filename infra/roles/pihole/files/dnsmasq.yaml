dnsmasq:
  # -- Load custom user configuration files from /etc/dnsmasq.d
  enableCustomDnsMasq: true

  # -- Add upstream dns servers. All lines will be added to the pihole dnsmasq configuration
  upstreamServers: []
  # - server=/foo.bar/192.168.178.10
  # - server=/bar.foo/192.168.178.11

  # -- Add custom dns entries to override the dns resolution. All lines will be added to the pihole dnsmasq configuration.
  # Every hostname the cluster serves needs an entry here. The blackbox
  # exporter probes from inside the cluster, so it resolves these through
  # CoreDNS and its probes fail for anything missing. Compare against
  # `kubectl get ingress -A` plus the Traefik dashboard IngressRoute.
  customDnsEntries:
    - address=/alertmanager.houli.eu/192.168.1.250
    - address=/blackbox.houli.eu/192.168.1.250
    - address=/grafana.houli.eu/192.168.1.250
    - address=/jenkins.houli.eu/192.168.1.250
    - address=/ksm.houli.eu/192.168.1.250
    - address=/longhorn.houli.eu/192.168.1.250
    - address=/ntfy.houli.eu/192.168.1.250
    - address=/omv.houli.eu/192.168.1.96
    - address=/pihole-1.houli.eu/192.168.1.250
    - address=/pihole-2.houli.eu/192.168.1.250
    - address=/prometheus.houli.eu/192.168.1.226
    - address=/postgres.houli.eu/192.168.1.226
    - address=/prowlarr.houli.eu/192.168.1.250
    - address=/sonarr.houli.eu/192.168.1.250
    - address=/radarr.houli.eu/192.168.1.250
    - address=/traefik.houli.eu/192.168.1.250
    - address=/transmission.houli.eu/192.168.1.250
    - address=/uptime.houli.eu/192.168.1.250
    - address=/plex.home/192.168.1.250
    - address=/plex.houli.eu/192.168.1.250
    - address=/paperless.houli.eu/192.168.1.250
    - address=/authentik.houli.eu/192.168.1.250
    - address=/homepage.houli.eu/192.168.1.250

  # -- Dnsmasq reads the /etc/hosts file to resolve ips. You can add additional entries if you like
  # These must match the static_ip values in infra/inventory.yaml, which
  # set_static_ip writes onto each node. The old values here predated that
  # migration and pointed at addresses nothing is on any more.
  #
  # lib-pi-04 and lib-pi-06 are the exceptions: set_static_ip has not run on
  # either, so they are still on their original addresses and these entries
  # match where they actually are, not their inventory static_ip (.237 and
  # .239). Update them when those nodes move.
  #
  # lib-hp-01 is the NAS, not an Ansible-managed node, so it has no static_ip
  # entry in the inventory.
  additionalHostsEntries:
    - 192.168.1.96    lib-hp-01.home
    - 192.168.1.242   lib-nuc-01.home
    - 192.168.1.234   lib-pi-01.home
    - 192.168.1.235   lib-pi-02.home
    - 192.168.1.236   lib-pi-03.home
    - 192.168.1.15    lib-pi-04.home
    - 192.168.1.238   lib-pi-05.home
    - 192.168.1.226   lib-pi-06.home
    - 192.168.1.230   lib-potato-01.home
    - 192.168.1.231   lib-potato-02.home
    - 192.168.1.232   lib-potato-03.home
    - 192.168.1.233   lib-potato-04.home

