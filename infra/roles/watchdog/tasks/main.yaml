---
- name: Install watchdog
  apt:
    # iputils-ping is what node-isolation-check probes with, and the watchdog
    # package does not depend on it. Without it every probe fails and the node
    # reboots itself, so make the dependency explicit rather than assumed.
    name:
      - watchdog
      - iputils-ping
    state: present
    update_cache: true

- name: Check watchdog device
  stat:
    path: /dev/watchdog
  register: wd_dev

- name: Persist kernel module across reboots
  copy:
    dest: /etc/modules-load.d/watchdog.conf
    content: "{{ watchdog_kernel_module }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Load kernel module now if /dev/watchdog missing
  modprobe:
    name: "{{ watchdog_kernel_module }}"
    state: present
  when: not wd_dev.stat.exists

- name: Verify /dev/watchdog is present
  stat:
    path: /dev/watchdog
  register: wd_dev_final

- name: Fail if watchdog device is still missing
  fail:
    msg: >
      /dev/watchdog not found after loading {{ watchdog_kernel_module }}.
      Check kernel support for this board.
  when: not wd_dev_final.stat.exists

# Deployed before the config that references it, so the daemon never restarts
# against a test-binary that does not exist yet.
- name: Deploy node isolation check
  template:
    src: node-isolation-check.sh.j2
    dest: "{{ watchdog_isolation_check_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart watchdog

# Run the check before the config that arms it, so a script that cannot work on
# this node aborts the play instead of reaching the daemon. This is the only
# guard against ping being installed but unable to open a socket (observed on
# lib-potato-04 as "missing cap_net_raw+p capability"), which is invisible from
# inside the script because iputils returns exit 2 both for that and for a
# genuinely unreachable network. Skipped under --check, where the script may not
# be on disk yet.
- name: Verify the isolation check runs and passes on this node
  command: "{{ watchdog_isolation_check_path }}"
  register: wd_isolation_check
  changed_when: false
  when: not ansible_check_mode

# Half one of the boot-window fix; the grace period inside the check script is
# half two. Both are needed — network-online.target can be reached before the
# link is genuinely usable, and ordering alone does not cover that.
- name: Ensure watchdog service drop-in directory exists
  file:
    path: "{{ systemd_dir }}/watchdog.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Order watchdog after the network is online
  copy:
    dest: "{{ systemd_dir }}/watchdog.service.d/10-network-online.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (infra/roles/watchdog).
      #
      # The packaged unit has no ordering against the network, so it starts
      # ~31s into boot while only lo has carrier. Every probe then fails with
      # errno 101 and the node reboots ~75s in, making every reboot cost two.
      # See .scratch/node-hardening/issues/07-watchdog-starts-before-network.md
      [Unit]
      Wants=network-online.target
      After=network-online.target
  notify:
    - reload systemd
    - restart watchdog

# network-online.target only means anything if a wait-online unit is enabled to
# hold it back. These nodes render netplan with `renderer: networkd`
# (infra/roles/set_static_ip), so systemd-networkd owns eth0 and this is the
# matching wait unit. Note it can delay boot by up to its own timeout (120s by
# default) if a configured interface never comes up.
- name: Enable systemd-networkd-wait-online
  systemd:
    name: systemd-networkd-wait-online
    enabled: true

- name: Configure watchdog
  template:
    src: watchdog.conf.j2
    dest: /etc/watchdog.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart watchdog

- name: Enable and start watchdog
  systemd:
    name: watchdog
    enabled: true
    state: started
