---

- name: Run Common Operations
  hosts: all_nodes
  become: true
  roles:
    - common
  vars_files:
    - ../vars/main.yaml
  tags:
    - basic

- name: Move root to ssd
  hosts: sbc
  become: true
  roles:
    - root_storage
  vars_files:
    - ../vars/main.yaml
    - ../vars/root_storage.yaml
  tags:
    - storage

- name: Move root to ssd
  hosts: sbc
  become: true
  roles:
    - root_dir_migrate
  vars_files:
    - ../vars/main.yaml
    - ../vars/root_storage.yaml
  tags:
    - storage

- name: Re-add the boot directory from the sd card
  hosts: potatoes
  become: true
  roles:
    - boot_mount
  vars_files:
    - ../vars/main.yaml
    - ../vars/root_storage.yaml
  tags:
    - storage

# Applying netplan restarts k3s, which takes a control plane node out of the
# `kubernetes` service endpoints for two to three minutes. Run this against one
# control plane node at a time and wait for all three endpoints to come back
# before the next, or a second node leaves etcd without quorum.
- name: Set Static IP
  hosts: all_nodes
  become: true
  roles:
    - set_static_ip
  vars_files:
    - ../vars/main.yaml
  tags:
    - static_ip


