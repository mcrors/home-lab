
- name: Configure multipath blacklist on NUC nodes
  hosts: nucs
  become: true
  roles:
    - multipath
  vars_files:
    - ../vars/main.yaml

- name: Install longhorn pre-reqs
  hosts: longhorn
  become: true
  roles:
    - longhorn_prereq
  vars_files:
      - ../vars/main.yaml

- name: Setup storage node disks
  hosts: longhorn
  become: true
  roles:
    - longhorn_disk_setup
  vars_files:
      - ../vars/main.yaml

- name: Install longhorn into K3s
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  roles:
    - longhorn_chart
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
      - ../vars/main.yaml
