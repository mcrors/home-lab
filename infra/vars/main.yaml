---

# Basic vars
ansible_user: hla
systemd_dir: /etc/systemd/system
networkmanager_connection_name: ansible-managed
gateway: 192.168.1.1
pihole_dns_ip: 192.168.1.15
k3s_pihole_dns_ip: 192.168.1.252

# k3 vars
k3s_version: v1.32.13+k3s1
k3s_download_path: /usr/local/bin
k3s_resolv_conf_location: /etc/rancher/k3s
k3s_server_location: /var/lib/rancher/k3s
master_ip: 192.168.1.249
extra_server_args: ""
extra_agent_args: ""
k3s_master: lib-potato-01.home

# kubectl vars
kubeconfig_path: "{{ lookup('env','KUBECONFIG') | default('~/.kube/config', true) }}"

# Journald vars
journald_system_max_use: "200M"
journald_system_max_file_size: "50M"
journald_max_retention: "7day"

# watchdog vars
# watchdog_timeout deliberately absent. Both board families report a 60s hardware
# timeout against the 15s interval — a 4:1 margin — so setting it here would only
# restate the driver default and give us another number to keep in sync. Measured
# 2026-08-30 on lib-potato-04 (Meson GXBB) and lib-pi-01 (Broadcom BCM2835); see
# .scratch/node-hardening/issues/03-watchdog-config-cleanup.md.
#
# watchdog_max_load1 deliberately absent too. It wrote a max-load-1 line that
# rebooted the node above a 1-minute load average of 24 — and load average counts
# processes blocked on I/O, not just CPU, so it fired on nodes that were merely
# waiting on NFS. Removed 2026-08-31, §3 of the same ticket.

# prometheus_scraper_namespace used by both prometheus_scraper and prometheus
prometheus_scraper_namespace: prometheus-access
